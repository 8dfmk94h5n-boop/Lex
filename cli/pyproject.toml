[project]
name = "uipro"
version = "3.0.0"
description = "CLI to install UI/UX Pro Max skill for AI coding assistants"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ui", "ux", "design", "claude", "cursor", "windsurf", "copilot", "ai", "skill"]
authors = [{ name = "regutierrez" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.27",
    "questionary>=2.0",
]

[project.scripts]
uipro = "uipro.cli:main"

[project.urls]
Homepage = "https://github.com/regutierrez/ui-ux-skill"
Repository = "https://github.com/regutierrez/ui-ux-skill"
Issues = "https://github.com/regutierrez/ui-ux-skill/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uipro"]

[tool.hatch.build.targets.sdist]
include = ["src/", "assets/"]

[dependency-groups]
dev = [
    "basedpyright>=1.22",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownMemberType = false
venvPath = "."
venv = ".venv"
